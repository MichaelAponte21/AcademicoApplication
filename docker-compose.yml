services:
  demo-academico:
    build: .
    image: demo-academico:latest
    container_name: demo-academico
    ports:
      - "8080:8080"
    environment:
      # Sobrescriben application.yaml (Spring relaxed binding)
      APP_SEED_ENABLED: "true"
      APP_SEED_CANTIDAD_ESTUDIANTES: "50"
      APP_SEED_CANTIDAD_PROGRAMAS: "3"
      APP_SEED_CANTIDAD_ASIGNATURAS: "10"
      APP_SEED_CANTIDAD_GRUPOS: "20"
    restart: unless-stopped
